<style>
:root{--ink:#192334;--muted:#5c687a;--brand:#5b4bdb;--line:#e2e7ef;--surface:#fff;--wash:#f5f6fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--wash);color:var(--ink);line-height:1.6}
main{width:min(900px,92vw);margin:48px auto}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,4vw,38px);box-shadow:0 12px 30px #202b450d}

<body><main><a class="back" href="../../index.html">← Task index</a><section class="panel"><p class="eyebrow">Level 3 · Task 5</p><h1>Loading Posts from an API</h1><p>I used fetch() to get sample posts from JSONPlaceholder. Click the button to load them. If the request fails, a message should appear.</p><div class="toolbar"><button id="loadPosts" type="button">Load posts</button><span id="apiStatus" role="status" aria-live="polite">Ready to fetch sample posts.</span></div><div id="posts" class="posts" aria-live="polite"></div></section></main><script src="script.js" defer></script></body></html>
