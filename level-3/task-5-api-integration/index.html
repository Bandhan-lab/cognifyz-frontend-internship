<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 5 — API Integration</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #20263a;
      background: #f4f6fb;
    }

    main {
      max-width: 760px;
      margin: 24px auto;
      padding: 24px;
      background: white;
      border: 1px solid #dfe4ed;
      border-radius: 10px;
    }

    a {
      color: #5144bd;
    }

    button {
      padding: 10px 16px;
      font: inherit;
      color: white;
      background: #5144bd;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #apiStatus {
      color: #4f596a;
    }

    .post {
      margin-top: 14px;
      padding: 16px;
      background: white;
      border: 1px solid #dfe4ed;
      border-radius: 8px;
    }

    .post h2 {
      margin-top: 0;
      font-size: 1.1rem;
      text-transform: capitalize;
    }

    .post p {
      margin-bottom: 0;
      color: #4f596a;
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <a href="../../index.html">← Back to task list</a>
    <h1>Loading Posts from an API</h1>
    <p>
      This page gets sample posts from JSONPlaceholder using JavaScript.
      Press the button to load the posts. An error message is shown if the
      request does not work.
    </p>

    <div class="toolbar">
      <button id="loadPosts" type="button">Load posts</button>
      <span id="apiStatus" role="status" aria-live="polite">Ready to fetch sample posts.</span>
    </div>

    <div id="posts" aria-live="polite"></div>
  </main>
</body>
</html>
