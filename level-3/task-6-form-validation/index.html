<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 6 — Form Styling and Validation</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <a class="back" href="../../index.html">← Back to task list</a>
    <section class="panel">
      <h1>Contact Form Validation</h1>
      <p>
        Fill in the form and press the button to check the values.
        This is only a front-end demo, so the information is not sent anywhere.
      </p>

      <form id="contactForm" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" autocomplete="name" required minlength="2" aria-describedby="nameError">
          <small id="nameError" class="error"></small>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="emailError">
          <small id="emailError" class="error"></small>
        </div>

        <div class="field">
          <label for="topic">Topic</label>
          <select id="topic" name="topic" required aria-describedby="topicError">
            <option value="">Choose a topic</option>
            <option>Internship task</option>
            <option>Front-end development</option>
            <option>General question</option>
          </select>
          <small id="topicError" class="error"></small>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required minlength="10" aria-describedby="messageError"></textarea>
          <small id="messageError" class="error"></small>
        </div>

        <button type="submit">Validate form</button>
        <p id="formStatus" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
