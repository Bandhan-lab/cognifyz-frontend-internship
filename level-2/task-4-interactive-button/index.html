<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 4 — Interactive Button</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #20263a;
      background: #f4f6fb;
    }

    main {
      max-width: 760px;
      margin: 24px auto;
      padding: 24px;
      background: white;
      border: 1px solid #dfe4ed;
      border-radius: 10px;
    }

    a {
      color: #5144bd;
    }

    button {
      padding: 10px 16px;
      font: inherit;
      color: white;
      background: #5144bd;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #aaa1ff;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <a href="../../index.html">← Back to task list</a>
    <h1>Change the Background Colour</h1>
    <p>Click the button to change the background colour of the page.</p>
    <button id="colorButton" type="button">Change background</button>
    <p id="colorStatus" role="status" aria-live="polite">Current background: default</p>
  </main>

  <script>
    // These are the colours I want to use when the button is clicked.
    const colors = [
      { name: "lavender", value: "#eeeaff" },
      { name: "mint", value: "#e4f8ef" },
      { name: "sky", value: "#e6f3ff" },
      { name: "peach", value: "#fff0e5" }
    ];

    let index = -1;
    const button = document.querySelector("#colorButton");
    const status = document.querySelector("#colorStatus");

    button.addEventListener("click", function () {
      // Move to the next colour, then start again at the beginning.
      index = (index + 1) % colors.length;
      document.body.style.backgroundColor = colors[index].value;
      status.textContent = "Current background: " + colors[index].name;
    });
  </script>
</body>
</html>
